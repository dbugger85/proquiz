<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b24">
  <title>ProQuiz</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="phone">
  <form id="join" class="phone-join" hidden>
    <header class="join-head">
      <span class="wordmark">ProQuiz</span>
      <p id="brand-name" class="brand-name" hidden></p>
    </header>
    <h1 data-t="joinTitle">Join the quiz</h1>
    <label class="field">
      <span id="name-label" data-t="teamName">Team name</span>
      <input id="name" type="text" maxlength="20" autocomplete="off" autocapitalize="words" enterkeyhint="done" data-t-placeholder="teamNamePlaceholder" required>
    </label>
    <label class="field" id="pin-field" hidden>
      <span data-t="pinLabel">PIN</span>
      <input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="done">
    </label>
    <fieldset id="avatar-field" class="avatar-field">
      <legend id="avatar-title" data-t="avatarTitle">Your avatar</legend>
      <div class="avatar-row">
        <span id="avatar-preview" class="avatar avatar-big" role="img" data-t-aria-label="avatarPreview"></span>
        <button id="avatar-random" class="avatar-dice" type="button" data-t-aria-label="avatarRandom" data-t-title="avatarRandom">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5" fill="#fff"/><g fill="#2c2a63"><circle cx="8" cy="8" r="1.8"/><circle cx="16" cy="8" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="8" cy="16" r="1.8"/><circle cx="16" cy="16" r="1.8"/></g></svg>
        </button>
        <button id="avatar-edit" class="btn avatar-edit" type="button" aria-expanded="false" aria-controls="avatar-builder" data-t="avatarCustomise">Customise</button>
      </div>
      <div id="avatar-builder" class="avatar-builder" hidden>
        <div id="avatar-tabs" class="avatar-tabs" role="tablist"></div>
        <div id="avatar-opts" class="avatar-opts" role="radiogroup"></div>
      </div>
    </fieldset>
    <fieldset>
      <legend data-t="pickColor">Pick your colour</legend>
      <div id="swatches" class="swatches"></div>
    </fieldset>
    <!-- A quiz with extra languages (lib/languages.js): which one this phone reads the questions in -->
    <fieldset id="lang-field" class="lang-field" hidden>
      <legend data-t="readIn">Read questions in:</legend>
      <div id="lang-pills" class="pills lang-pills"></div>
      <small id="lang-hint" class="muted" data-t="readInHint"></small>
    </fieldset>
    <p id="join-error" class="error" role="alert"></p>
    <button id="join-btn" class="btn btn-primary" type="submit" data-t="joinButton">Join the game</button>
  </form>

  <main id="team" class="phone-team" hidden>
    <header>
      <div id="me" class="me"></div>
      <!-- The flag of the language this phone reads the questions in (a quiz with extra languages); tap to change it -->
      <button id="lang-pill" class="lang-pill" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu" hidden></button>
      <div id="score" class="score" data-count="score"></div>
    </header>
    <div id="lang-menu" class="lang-menu" hidden>
      <p class="small" data-t="readIn"></p>
      <div class="pills lang-pills"></div>
    </div>
    <div id="stage" class="stage"></div>
  </main>

  <div id="offline" class="offline-banner" data-t="reconnecting" hidden>Reconnecting…</div>
  <!-- The host quit ProQuiz: the server said goodbye, and this page never connects again -->
  <div id="stopped" class="stopped" hidden>
    <h1 data-t="endedTitle"></h1>
    <p data-t="endedText"></p>
  </div>

  <script type="module" src="/js/phone.js"></script>
</body>
</html>
