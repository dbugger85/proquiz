<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProQuiz – Host</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="host">
    <header class="host-bar">
      <span class="wordmark">ProQuiz</span>
      <span id="set-title" class="set-title"></span>
      <span class="spacer"></span>
      <button id="help-btn" class="btn" type="button"><span data-t="helpBtn"></span> <kbd>?</kbd></button>
      <a class="btn" href="/display" target="proquiz-display" data-t="openDisplay">Open TV screen</a>
    </header>

    <p id="host-error" class="error" role="alert" hidden></p>

    <section id="lobby" class="lobby" hidden>
      <div id="resume" class="resume" hidden>
        <div>
          <h2 data-t="resumeTitle"></h2>
          <p id="resume-text"></p>
          <ul id="resume-teams" class="resume-teams"></ul>
        </div>
        <div class="row">
          <button id="resume-yes" class="btn btn-primary" type="button" data-t="resumeYes"></button>
          <button id="resume-no" class="btn" type="button" data-t="resumeNo"></button>
        </div>
      </div>
      <div class="join-card">
        <h2 data-t="scanToJoin">Scan to join</h2>
        <div id="qr" class="qr"></div>
        <p id="url" class="url"></p>
        <p class="hint" data-t="hostOnLaptopHint"></p>
      </div>

      <div>
        <h2><span data-t="teams">Teams</span> <span id="team-count"></span></h2>
        <ul id="teams" class="team-list"></ul>
        <p id="no-teams" class="empty" data-t="noTeamsYet"></p>
        <div class="start-row">
          <button id="start" class="btn btn-primary" type="button" data-t="startGame">Start game</button>
          <p id="start-why" class="why" data-t="needTeam"></p>
        </div>
      </div>

      <form id="settings" class="settings">
        <h2 data-t="settings">Settings</h2>
        <label class="field">
          <span data-t="questionSet">Questions</span>
          <select id="set-picker"></select>
        </label>
        <a class="btn" href="/editor" data-t="editQuestions"></a>
        <label class="field">
          <span data-t="language">Language</span>
          <select name="lang">
            <option value="en">English</option>
            <option value="no">Norsk</option>
          </select>
        </label>
        <label class="field">
          <span data-t="wrongAnswer">Wrong answer costs</span>
          <select name="penalty">
            <option value="none" data-t="penaltyNone"></option>
            <option value="half" data-t="penaltyHalf"></option>
            <option value="full" data-t="penaltyFull"></option>
          </select>
        </label>
        <label class="check"><input type="checkbox" name="allowNegative"> <span data-t="allowNegative"></span></label>
        <label class="check"><input type="checkbox" name="phonePick"> <span data-t="phonePick"></span></label>
        <label class="check"><input type="checkbox" name="fairBuzz"> <span><span data-t="fairBuzz"></span><br><small data-t="fairBuzzHint"></small></span></label>
        <label class="field">
          <span data-t="buzzSeconds"></span>
          <span class="row"><input type="number" name="buzzSeconds" min="0" max="120" step="1"> <small data-t="zeroOff"></small></span>
        </label>
        <label class="field">
          <span data-t="answerSeconds"></span>
          <span class="row"><input type="number" name="answerSeconds" min="0" max="120" step="1"> <small data-t="zeroOff"></small></span>
        </label>
        <div class="row">
          <label class="check"><input type="checkbox" name="sound"> <span data-t="soundOn"></span></label>
          <button id="test-sound" class="btn" type="button" data-t="testSound"></button>
        </div>
        <label class="check"><input type="checkbox" name="music"> <span data-t="musicOn"></span></label>
        <label class="field">
          <span data-t="musicVolume"></span>
          <input type="range" name="musicVolume" min="0" max="100" step="5">
        </label>
        <fieldset id="music-files" class="crazy-kinds music-files">
          <legend data-t="musicFiles"></legend>
          <small data-t="musicHint"></small>
          <div id="music-file-list"></div>
        </fieldset>
        <label class="field">
          <span data-t="crazyMode"></span>
          <select name="crazy">
            <option value="off" data-t="crazyOff"></option>
            <option value="some" data-t="crazySome"></option>
            <option value="lots" data-t="crazyLots"></option>
          </select>
          <small data-t="crazyHint"></small>
        </label>
        <fieldset id="crazy-kinds" class="crazy-kinds">
          <legend data-t="crazyKinds"></legend>
          <div id="crazy-kind-list"></div>
          <small id="crazy-none" class="error" data-t="crazyNone" hidden></small>
        </fieldset>
        <label class="check quiz-specials" id="quiz-specials" hidden><input type="checkbox" name="quizSpecials"> <span><span id="quiz-specials-label"></span><br><small data-t="quizSpecialsHint"></small></span></label>
        <label class="check" id="round2-setting" hidden><input type="checkbox" name="round2"> <span id="round2-label"></span></label>
        <label class="check"><input type="checkbox" name="finalRound"> <span data-t="finalRound"></span></label>
        <label class="field">
          <span data-t="finalSeconds"></span>
          <span class="row"><input type="number" name="finalSeconds" min="0" max="300" step="1"> <small data-t="zeroOff"></small></span>
        </label>
      </form>
    </section>

    <section id="game" hidden></section>
  </div>
  <div id="help" class="help" hidden></div>
  <button id="sound-unlock" class="sound-unlock" type="button" data-t="tapForSound" hidden></button>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
