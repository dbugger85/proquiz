<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProQuiz – Host</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="host">
    <header class="host-bar">
      <span class="wordmark">ProQuiz</span>
      <span id="set-title" class="set-title"></span>
      <span class="spacer"></span>
      <button id="menu-btn" class="btn" type="button" data-t="mainMenuBtn" hidden></button>
      <button id="help-btn" class="btn" type="button"><span data-t="helpBtn"></span> <kbd>?</kbd></button>
      <a class="btn" href="/display" target="proquiz-display" data-t="openDisplay">Open TV screen</a>
    </header>

    <p id="host-error" class="error" role="alert" hidden></p>

    <section id="lobby" class="lobby" hidden>
      <div id="resume" class="resume" hidden>
        <div>
          <h2 data-t="resumeTitle"></h2>
          <p id="resume-text"></p>
          <p class="resume-note" data-t="resumeNewTeams"></p>
          <ul id="resume-teams" class="resume-teams"></ul>
        </div>
        <div class="row">
          <button id="resume-yes" class="btn btn-primary" type="button" data-t="resumeYes"></button>
          <button id="resume-no" class="btn" type="button" data-t="resumeNo"></button>
        </div>
      </div>
      <div class="join-card">
        <h2 data-t="scanToJoin">Scan to join</h2>
        <div id="qr" class="qr"></div>
        <p id="url" class="url"></p>
        <p class="hint" data-t="hostOnLaptopHint"></p>
        <p id="tv-url" class="hint" hidden></p>
      </div>

      <div>
        <h2><span data-t="teams">Teams</span> <span id="team-count"></span></h2>
        <ul id="teams" class="team-list"></ul>
        <p id="no-teams" class="empty" data-t="noTeamsYet"></p>
        <div class="start-row">
          <button id="start" class="btn btn-primary" type="button" data-t="startGame">Start game</button>
          <p id="start-why" class="why" data-t="needTeam"></p>
        </div>
      </div>

      <form id="settings" class="settings">
        <h2 data-t="settings">Settings</h2>

        <!-- Quiz: what changes from game to game. Always open. -->
        <div class="settings-group quiz-group">
          <label class="field">
            <span data-t="questionSet">Questions</span>
            <span class="row picker-row"><select id="set-picker"></select> <a class="btn btn-small" href="/editor" data-t="editShort"></a></span>
          </label>
          <fieldset class="field pill-field">
            <legend data-t="language">Language</legend>
            <div class="pills">
              <label><input type="radio" name="lang" value="en"><span>English</span></label>
              <label><input type="radio" name="lang" value="no"><span>Norsk</span></label>
            </div>
          </fieldset>
          <label class="check" id="round2-setting" hidden><input type="checkbox" name="round2"> <span id="round2-label"></span></label>
          <div class="row final-setting" id="final-setting">
            <label class="check"><input type="checkbox" name="finalRound"> <span data-t="finalRound"></span></label>
            <label class="seconds" id="final-seconds"><input type="number" name="finalSeconds" min="0" max="300" step="1" data-t-aria-label="finalSeconds"> <span data-t="secondsShort"></span></label>
          </div>
          <label class="check quiz-specials" id="quiz-specials" hidden><input type="checkbox" name="quizSpecials"> <span><span id="quiz-specials-label"></span><br><small data-t="quizSpecialsHint"></small></span></label>
        </div>

        <details class="settings-group" id="group-crazy" open>
          <summary><span class="group-title" data-t="crazyMode"></span> <span class="group-status" id="crazy-status"></span></summary>
          <div class="pills" role="radiogroup" data-t-aria-label="crazyMode">
            <label><input type="radio" name="crazy" value="off"><span data-t="crazyOff"></span></label>
            <label><input type="radio" name="crazy" value="some"><span data-t="crazySome"></span></label>
            <label><input type="radio" name="crazy" value="lots"><span data-t="crazyLots"></span></label>
          </div>
          <small class="hint" data-t="crazyHint"></small>
          <fieldset id="crazy-kinds" class="crazy-kinds">
            <legend data-t="crazyKinds"></legend>
            <div id="crazy-kind-list"></div>
            <small id="crazy-none" class="error" data-t="crazyNone" hidden></small>
          </fieldset>
        </details>

        <details class="settings-group" id="group-rules">
          <summary><span class="group-title" data-t="groupRules"></span> <span class="group-status" id="rules-status"></span></summary>
          <fieldset class="field pill-field">
            <legend data-t="wrongAnswer">Wrong answer costs</legend>
            <div class="pills">
              <label><input type="radio" name="penalty" value="none"><span data-t="penaltyNoneShort"></span></label>
              <label><input type="radio" name="penalty" value="half"><span data-t="penaltyHalfShort"></span></label>
              <label><input type="radio" name="penalty" value="full"><span data-t="penaltyFullShort"></span></label>
            </div>
          </fieldset>
          <label class="check" id="negative-setting"><input type="checkbox" name="allowNegative"> <span data-t="allowNegative"></span></label>
          <div class="field">
            <span data-t="timers"></span>
            <div class="row timers-row">
              <label class="seconds"><span data-t="timerBuzz"></span> <input type="number" name="buzzSeconds" min="0" max="120" step="1"> <span data-t="secondsShort"></span></label>
              <label class="seconds"><span data-t="timerAnswer"></span> <input type="number" name="answerSeconds" min="0" max="120" step="1"> <span data-t="secondsShort"></span></label>
            </div>
            <small data-t="zeroOff"></small>
          </div>
          <label class="check"><input type="checkbox" name="phonePick"> <span data-t="phonePick"></span></label>
          <label class="check with-hint"><input type="checkbox" name="fairBuzz"> <span><span data-t="fairBuzz"></span><br><small data-t="fairBuzzHint"></small></span></label>
        </details>

        <details class="settings-group" id="group-sound">
          <summary><span class="group-title" data-t="groupSound"></span> <span class="group-status" id="sound-status"></span></summary>
          <div class="row">
            <label class="check"><input type="checkbox" name="sound"> <span data-t="soundOn"></span></label>
            <button id="test-sound" class="btn btn-small" type="button" data-t="testSound"></button>
          </div>
          <label class="check"><input type="checkbox" name="music"> <span data-t="musicOn"></span></label>
          <label class="field" id="volume-setting">
            <span data-t="musicVolume"></span>
            <input type="range" name="musicVolume" min="0" max="100" step="5">
          </label>
          <details id="music-files" class="settings-group nested music-files">
            <summary><span class="group-title" data-t="musicFilesTitle"></span> <span class="group-status" id="music-files-status"></span></summary>
            <small data-t="musicHint"></small>
            <div id="music-file-list"></div>
          </details>
        </details>

        <details class="settings-group" id="group-look">
          <summary><span class="group-title" data-t="groupLook"></span> <span class="group-status" id="look-status"></span></summary>
          <label class="check with-hint"><input type="checkbox" name="glass"> <span><span data-t="glassLook"></span><br><small data-t="glassHint"></small></span></label>
        </details>
      </form>
    </section>

    <section id="game" hidden></section>
  </div>
  <div id="help" class="help" hidden></div>
  <button id="sound-unlock" class="sound-unlock" type="button" data-t="tapForSound" hidden></button>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
