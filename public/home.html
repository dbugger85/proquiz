<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b24">
  <title>ProQuiz</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<!-- The website version's front page (docs/dev/web-plan.md): type the room code to join on a phone or to show the
     game on a TV, or host a quiz. The build script serves this as index.html; on the laptop it isn't used. -->
<body class="home">
  <main class="home-main">
    <header class="home-head">
      <span class="wordmark">ProQuiz</span>
      <div class="home-langs" role="group" data-t-aria-label="language">
        <button id="lang-en" class="btn btn-small btn-quiet" type="button" lang="en">English</button>
        <button id="lang-no" class="btn btn-small btn-quiet" type="button" lang="nb">Norsk</button>
      </div>
    </header>

    <section class="home-hero">
      <h1 data-t="homeTitle"></h1>
      <p class="home-tagline" data-t="homeTagline"></p>
    </section>

    <form id="join-form" class="home-card">
      <label class="field home-code-field">
        <span data-t="roomCodeTitle"></span>
        <input id="code" type="text" maxlength="7" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="go" data-t-placeholder="homeCodePlaceholder" required>
        <small data-t="homeCodeHint"></small>
      </label>
      <p id="code-error" class="error" role="alert" hidden></p>
      <div class="home-actions">
        <button id="join-btn" class="btn btn-primary" type="submit" data-t="homeJoin"></button>
        <button id="tv-btn" class="btn" type="button" data-t="homeTv"></button>
      </div>
    </form>

    <section class="home-card home-host">
      <h2 data-t="homeHostTitle"></h2>
      <p data-t="homeHostText"></p>
      <a id="host-btn" class="btn btn-primary" href="/host" data-t="homeHost"></a>
    </section>

    <footer class="home-foot">
      <a href="https://github.com/dbugger85/proquiz" rel="noopener" data-t="homeLaptop"></a>
    </footer>
  </main>
  <script type="module" src="/js/home.js"></script>
</body>
</html>
