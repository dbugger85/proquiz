<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProQuiz</title>
</head>
<body>
  <h1>ProQuiz – display</h1>
  <p id="status">Connecting…</p>
  <script type="module">
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (e) => (document.getElementById('status').textContent = 'Connected: ' + e.data);
  </script>
</body>
</html>
